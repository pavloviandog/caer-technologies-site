name: Monthly CAER blog draft

on:
  schedule:
    - cron: '17 9 1 * *'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (YYYY-MM); blank uses current Central month'
        required: false
        type: string
      topic:
        description: 'Optional evergreen topic or editorial brief'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: monthly-caer-blog
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate a monthly draft and open a review pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_TOPIC: ${{ inputs.topic }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          month="${INPUT_MONTH:-$(TZ=America/Chicago date +%Y-%m)}"
          [[ "$month" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo 'Month must be YYYY-MM'; exit 1; }
          branch="automation/caer-blog-$month"
          existing=$(gh pr list --head "$branch" --state all --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "Draft already handled: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -f "blog/$month-caer-tech-guide.html" ]; then
            echo 'This month is already published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo 'Recovering an existing draft branch; preserving edits.'
          else
            test -n "$OPENAI_API_KEY" || { echo 'Add the OPENAI_API_KEY Actions secret.'; exit 1; }
            python scripts/monthly_blog.py --month "$month" --topic "${INPUT_TOPIC:-A practical evergreen IT guide for small businesses}"
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "blog/$month-caer-tech-guide.html" blog/index.html sitemap.xml
            git commit -m "[CF-Pages-Skip] Draft CAER blog for $month"
            git push origin "HEAD:refs/heads/$branch"
          fi
          cat > "$RUNNER_TEMP/blog-pr.md" <<'BODY'
          Monthly AI-assisted CAER blog draft. Human review and merge are required for publication.

          Review the article for accuracy, usefulness, brand voice, company claims, and duplication. Verify the blog card and sitemap entry. The displayed date is the editorial month; adjust before merging if appropriate.

          This workflow never merges or calls Cloudflare. The draft commit uses `[CF-Pages-Skip]` to suppress Cloudflare Pages builds. Keep that prefix on further pre-approval commits. After approval, merge with a clean merge/squash commit message without the skip prefix to allow the existing production deployment.
          BODY
          url=$(gh pr create --base "$BASE_BRANCH" --head "$branch" --title "Review CAER blog: $month" --body-file "$RUNNER_TEMP/blog-pr.md" --draft)
          echo "Review draft: $url" >> "$GITHUB_STEP_SUMMARY"
